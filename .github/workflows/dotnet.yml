   name: Build and test

   on:
     push:
     pull_request:

   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - name: Check out code
           uses: actions/checkout@v4

         - name: Set up .NET 8
           uses: actions/setup-dotnet@v4
           with:
             dotnet-version: 8.0.x

         - name: Restore
           run: dotnet restore

         - name: Build
           run: dotnet build --no-restore

         - name: Test
           run: dotnet test --no-build --verbosity normal